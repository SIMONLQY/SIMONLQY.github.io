<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Chain of thought steps with process reward scores">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ecfeff"/>
      <stop offset="100%" stop-color="#a5f3fc"/>
    </linearGradient>
    <marker id="arrCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0891b2"/>
    </marker>
  </defs>
  <rect width="320" height="200" fill="url(#bg)"/>
  <circle cx="40" cy="40" r="46" fill="#cffafe" fill-opacity="0.85"/>
  <circle cx="285" cy="172" r="42" fill="#67e8f9" fill-opacity="0.35"/>

  <g font-family="-apple-system,'Helvetica Neue',sans-serif" font-size="9" font-weight="700" fill="#0891b2" text-anchor="middle">
    <text x="58" y="42">0.92</text>
    <text x="124" y="42">0.71</text>
    <text x="190" y="42">0.85</text>
    <text x="256" y="42">0.96</text>
  </g>

  <g stroke="#0891b2" stroke-width="1.6" fill="none">
    <line x1="74" y1="78" x2="108" y2="78" marker-end="url(#arrCyan)"/>
    <line x1="140" y1="78" x2="174" y2="78" marker-end="url(#arrCyan)"/>
    <line x1="206" y1="78" x2="240" y2="78" marker-end="url(#arrCyan)"/>
  </g>

  <g fill="#fff" stroke="#155e75" stroke-width="1.6">
    <circle cx="58" cy="78" r="14"/>
    <circle cx="124" cy="78" r="14"/>
    <circle cx="190" cy="78" r="14"/>
    <circle cx="256" cy="78" r="14" fill="#15803d" stroke="#15803d"/>
  </g>
  <g font-family="Georgia,serif" font-size="11" font-weight="700" fill="#164e63" text-anchor="middle">
    <text x="58" y="82">s₁</text>
    <text x="124" y="82">s₂</text>
    <text x="190" y="82">s₃</text>
  </g>
  <text x="256" y="82" text-anchor="middle" font-family="-apple-system,'Helvetica Neue',sans-serif" font-size="14" font-weight="700" fill="#fff">✓</text>

  <text x="160" y="110" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="9" fill="#0891b2">execution feedback → process reward</text>

  <line x1="130" y1="132" x2="190" y2="132" stroke="#0891b2" stroke-width="1" stroke-opacity="0.35"/>
  <text x="160" y="155" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="16" font-weight="700" fill="#164e63">CodePRM</text>
  <text x="160" y="178" text-anchor="middle" font-family="-apple-system,'Helvetica Neue',sans-serif" font-size="10" fill="#0891b2" letter-spacing="0.3">Process Reward via Execution</text>
</svg>
