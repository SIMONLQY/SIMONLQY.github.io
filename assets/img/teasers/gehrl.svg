<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="High-level policy steering a graph of low-level concepts">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef2ff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
  </defs>
  <rect width="320" height="200" fill="url(#bg)"/>
  <circle cx="40" cy="40" r="48" fill="#e0e7ff" fill-opacity="0.85"/>
  <circle cx="285" cy="172" r="40" fill="#a5b4fc" fill-opacity="0.38"/>

  <rect x="106" y="22" width="108" height="28" rx="14" fill="#fff" fill-opacity="0.92" stroke="#312e81" stroke-width="1.6"/>
  <text x="160" y="41" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="11" font-weight="700" fill="#312e81">High-level Goal π</text>

  <g stroke="#4338ca" stroke-width="1.2" stroke-dasharray="3 3" stroke-opacity="0.7">
    <line x1="125" y1="52" x2="80" y2="76"/>
    <line x1="160" y1="52" x2="160" y2="74"/>
    <line x1="195" y1="52" x2="240" y2="76"/>
  </g>

  <g stroke="#312e81" stroke-width="1.4" stroke-opacity="0.55">
    <line x1="80" y1="82" x2="118" y2="100"/>
    <line x1="160" y1="80" x2="118" y2="100"/>
    <line x1="160" y1="80" x2="200" y2="100"/>
    <line x1="240" y1="82" x2="200" y2="100"/>
    <line x1="118" y1="100" x2="200" y2="100"/>
  </g>
  <g stroke="#312e81" stroke-width="1.6" fill="#fff">
    <circle cx="80" cy="82" r="6.5"/>
