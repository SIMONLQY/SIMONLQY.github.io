    <circle cx="240" cy="82" r="6.5"/>
    <circle cx="118" cy="100" r="6.5"/>
    <circle cx="200" cy="100" r="6.5"/>
  </g>
  <text x="160" y="125" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="9" fill="#4338ca">low-level concepts</text>

  <line x1="130" y1="138" x2="190" y2="138" stroke="#4338ca" stroke-width="1" stroke-opacity="0.35"/>
  <text x="160" y="160" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="16" font-weight="700" fill="#312e81">GEHRL</text>
  <text x="160" y="180" text-anchor="middle" font-family="-apple-system,'Helvetica Neue',sans-serif" font-size="10" fill="#4338ca" letter-spacing="0.3">Hierarchical RL on Concept Graphs</text>
