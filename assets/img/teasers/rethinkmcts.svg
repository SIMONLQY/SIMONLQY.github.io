  <line x1="130" y1="130" x2="190" y2="130" stroke="#6d28d9" stroke-width="1" stroke-opacity="0.35"/>
  <text x="160" y="155" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="16" font-weight="700" fill="#4c1d95">RethinkMCTS</text>
  <text x="160" y="178" text-anchor="middle" font-family="-apple-system,'Helvetica Neue',sans-serif" font-size="10" fill="#6d28d9" letter-spacing="0.3">Refining Erroneous Thoughts in MCTS</text>
