  <rect width="320" height="200" fill="url(#bg)"/>
  <circle cx="40" cy="40" r="48" fill="#ede9fe" fill-opacity="0.85"/>
  <circle cx="285" cy="172" r="40" fill="#c4b5fd" fill-opacity="0.32"/>

