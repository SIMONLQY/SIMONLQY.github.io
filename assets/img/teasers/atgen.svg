<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Solver and adversary in a min-max loop">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect width="320" height="200" fill="url(#bg)"/>
  <circle cx="40" cy="40" r="46" fill="#dbeafe" fill-opacity="0.7"/>
  <circle cx="285" cy="170" r="40" fill="#93c5fd" fill-opacity="0.3"/>

  <circle cx="84" cy="68" r="28" fill="#fff" fill-opacity="0.85" stroke="#1e3a8a" stroke-width="1.6"/>
  <text x="84" y="65" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="11" font-weight="700" fill="#1e3a8a">Solver</text>
  <text x="84" y="82" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="14" font-weight="700" fill="#2563eb">{ }</text>

  <circle cx="236" cy="68" r="28" fill="#fff" fill-opacity="0.85" stroke="#1e3a8a" stroke-width="1.6"/>
  <text x="236" y="63" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="11" font-weight="700" fill="#1e3a8a">Tests</text>
  <g font-family="-apple-system,'Helvetica Neue',sans-serif" font-size="11" font-weight="700">
    <text x="223" y="82" fill="#15803d">✓</text>
    <text x="234" y="82" fill="#b91c1c">✗</text>
    <text x="245" y="82" fill="#b91c1c">✗</text>
  </g>

  <path d="M 112 54 Q 160 22 208 54" stroke="#2563eb" stroke-width="1.6" fill="none" marker-end="url(#arrBlue)"/>
  <text x="160" y="32" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="9" fill="#1e3a8a">solve</text>
  <path d="M 208 82 Q 160 114 112 82" stroke="#b91c1c" stroke-width="1.6" fill="none" marker-end="url(#arrRed)"/>
  <text x="160" y="116" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="9" fill="#b91c1c">attack</text>

  <line x1="130" y1="130" x2="190" y2="130" stroke="#2563eb" stroke-width="1" stroke-opacity="0.35"/>
  <text x="160" y="155" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="16" font-weight="700" fill="#1e3a8a">ATGen</text>
  <text x="160" y="178" text-anchor="middle" font-family="-apple-system,'Helvetica Neue',sans-serif" font-size="10" fill="#2563eb" letter-spacing="0.3">Adversarial RL for Test Generation</text>
</svg>
