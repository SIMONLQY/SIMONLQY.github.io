<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Candidate skills passing a gate into two disjoint credit channels — SkillGate">
  <defs>
    <linearGradient id="bgSG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <marker id="arrSlate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="320" height="200" fill="url(#bgSG)"/>
  <circle cx="36" cy="164" r="42" fill="#d1fae5" fill-opacity="0.8"/>
  <circle cx="292" cy="34" r="38" fill="#6ee7b7" fill-opacity="0.28"/>

  <!-- candidate slate: four skill files, one is the oracle -->
  <g stroke-width="1.3">
    <rect x="22" y="34" width="24" height="30" rx="3" fill="#fff" fill-opacity="0.75" stroke="#94a3b8"/>
    <rect x="52" y="34" width="24" height="30" rx="3" fill="#fff" fill-opacity="0.75" stroke="#94a3b8"/>
    <rect x="22" y="70" width="24" height="30" rx="3" fill="#fff" fill-opacity="0.75" stroke="#94a3b8"/>
    <rect x="52" y="70" width="24" height="30" rx="3" fill="#fff" stroke="#059669" stroke-width="1.8"/>
  </g>
  <g stroke="#cbd5e1" stroke-width="1.2">
    <line x1="27" y1="43" x2="41" y2="43"/><line x1="27" y1="50" x2="38" y2="50"/>
    <line x1="57" y1="43" x2="71" y2="43"/><line x1="57" y1="50" x2="68" y2="50"/>
    <line x1="27" y1="79" x2="41" y2="79"/><line x1="27" y1="86" x2="38" y2="86"/>
  </g>
  <g stroke="#a7f3d0" stroke-width="1.2">
    <line x1="57" y1="79" x2="71" y2="79"/>
  </g>
  <text x="64" y="94" text-anchor="middle" font-family="-apple-system,'Helvetica Neue',sans-serif" font-size="11" font-weight="700" fill="#059669">✓</text>

  <!-- the gate -->
  <g fill="#065f46">
    <rect x="106" y="30" width="5" height="76" rx="1.5"/>
    <rect x="129" y="30" width="5" height="76" rx="1.5"/>
    <rect x="102" y="26" width="36" height="5" rx="1.5"/>
  </g>
  <path d="M 80 85 Q 96 68 104 68" stroke="#059669" stroke-width="1.6" fill="none" marker-end="url(#arrGreen)"/>

  <!-- token strip: skill-naming tokens vs execution tokens, disjoint -->
  <g>
    <rect x="150" y="62" width="11" height="11" rx="2" fill="#059669"/>
    <rect x="164" y="62" width="11" height="11" rx="2" fill="#059669"/>
    <rect x="178" y="62" width="11" height="11" rx="2" fill="#34d399"/>
    <rect x="202" y="62" width="11" height="11" rx="2" fill="#93c5fd"/>
    <rect x="216" y="62" width="11" height="11" rx="2" fill="#93c5fd"/>
    <rect x="230" y="62" width="11" height="11" rx="2" fill="#93c5fd"/>
    <rect x="244" y="62" width="11" height="11" rx="2" fill="#93c5fd"/>
    <rect x="258" y="62" width="11" height="11" rx="2" fill="#93c5fd"/>
    <rect x="272" y="62" width="11" height="11" rx="2" fill="#93c5fd"/>
  </g>
  <path d="M 169 48 L 169 58" stroke="#059669" stroke-width="1.6" marker-end="url(#arrGreen)"/>
  <path d="M 240 48 L 240 58" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrSlate)"/>
  <text x="169" y="42" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="9" fill="#065f46">choice credit</text>
  <text x="240" y="42" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="9" fill="#1e40af">outcome credit</text>
  <text x="169" y="88" text-anchor="middle" font-family="-apple-system,'Helvetica Neue',sans-serif" font-size="8" fill="#047857">skill tokens</text>
  <text x="240" y="88" text-anchor="middle" font-family="-apple-system,'Helvetica Neue',sans-serif" font-size="8" fill="#3730a3">execution tokens</text>

  <line x1="130" y1="130" x2="190" y2="130" stroke="#059669" stroke-width="1" stroke-opacity="0.35"/>
  <text x="160" y="155" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="16" font-weight="700" fill="#065f46">SkillGate</text>
  <text x="160" y="178" text-anchor="middle" font-family="-apple-system,'Helvetica Neue',sans-serif" font-size="10" fill="#059669" letter-spacing="0.3">Two Disjoint Credit Channels for Skill Selection</text>
</svg>
