<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Privileged teacher distilling knowledge to an RL student policy">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0fdfa"/>
      <stop offset="100%" stop-color="#99f6e4"/>
    </linearGradient>
    <marker id="arrTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0d9488"/>
    </marker>
  </defs>
  <rect width="320" height="200" fill="url(#bg)"/>
  <circle cx="280" cy="40" r="48" fill="#5eead4" fill-opacity="0.38"/>
  <circle cx="42" cy="172" r="36" fill="#ccfbf1" fill-opacity="0.85"/>

  <g stroke="#115e59" stroke-width="1.5" fill="none" stroke-linecap="round">
    <line x1="20" y1="50" x2="32" y2="60"/>
    <line x1="20" y1="68" x2="32" y2="68"/>
    <line x1="20" y1="86" x2="32" y2="76"/>
  </g>
  <text x="13" y="42" font-family="Georgia,serif" font-style="italic" font-size="8" fill="#0d9488">privileged</text>
  <rect x="32" y="42" width="84" height="58" rx="8" fill="#fff" fill-opacity="0.9" stroke="#0f766e" stroke-width="1.6"/>
  <text x="74" y="64" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="11" font-weight="700" fill="#134e4a">Teacher</text>
  <text x="74" y="80" text-anchor="middle" font-family="-apple-system,'Helvetica Neue',sans-serif" font-size="9" fill="#0d9488">knowledge state</text>
  <text x="74" y="93" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11" font-weight="700" fill="#0d9488">Φ(s)</text>

  <line x1="120" y1="71" x2="200" y2="71" stroke="#0d9488" stroke-width="1.8" marker-end="url(#arrTeal)"/>
  <g fill="#0d9488" fill-opacity="0.55">
    <circle cx="142" cy="58" r="2"/>
    <circle cx="160" cy="84" r="2.2"/>
    <circle cx="180" cy="58" r="1.8"/>
  </g>
  <text x="160" y="50" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="10" fill="#115e59">distill</text>

  <rect x="208" y="52" width="68" height="40" rx="8" fill="#fff" fill-opacity="0.9" stroke="#0f766e" stroke-width="1.6"/>
  <text x="242" y="68" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="11" font-weight="700" fill="#134e4a">Student</text>
  <text x="242" y="83" text-anchor="middle" font-family="-apple-system,'Helvetica Neue',sans-serif" font-size="9" fill="#0d9488">RL policy π</text>

  <line x1="130" y1="125" x2="190" y2="125" stroke="#0d9488" stroke-width="1" stroke-opacity="0.35"/>
  <text x="160" y="150" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="14" font-weight="700" fill="#134e4a">Privileged Distillation</text>
  <text x="160" y="172" text-anchor="middle" font-family="-apple-system,'Helvetica Neue',sans-serif" font-size="10" fill="#0d9488" letter-spacing="0.3">Stabilizing RL for Path Recommendation</text>
</svg>
